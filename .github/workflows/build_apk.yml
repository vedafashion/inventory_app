name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Generate Android files & connect Firebase
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp lib/main.dart main.dart.bak
          flutter create . --org com.shop --project-name inventory_app --platforms android
          mv pubspec.yaml.bak pubspec.yaml
          mv main.dart.bak lib/main.dart
          cp google-services.json android/app/google-services.json
          sed -i 's/android:label="inventory_app"/android:label="Veda Fashion Hub"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/gradle-[0-9.]*-all.zip/gradle-8.7-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/id "com.android.application" version "[^"]*"/id "com.android.application" version "8.6.0"/' android/settings.gradle
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "com.google.gms.google-services" version "4.4.2" apply false\n    id "org.jetbrains.kotlin.android" version "2.1.0"/' android/settings.gradle
          sed -i 's/id "kotlin-android"/id "kotlin-android"\n    id "com.google.gms.google-services"/' android/app/build.gradle
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' android/app/build.gradle
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle

      - name: Install packages & build APK
        run: |
          if [ -f "Logo.png" ] && [ ! -f "logo.png" ]; then mv Logo.png logo.png; fi
          if [ ! -f "logo.png" ]; then sed -i '/logo.png/d' pubspec.yaml; fi
          flutter pub get
          if [ -f "logo.png" ]; then dart run flutter_launcher_icons; fi
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veda-fashion-hub-apk
          path: build/app/outputs/flutter-apk/app-release.apk
